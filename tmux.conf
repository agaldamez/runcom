################################
####   Tmux Configuration   ####
################################

# Set prefix to control a
set-option -g prefix C-a
unbind-key C-a
bind-key C-a send-prefix

# Centered floating window with a specific size
bind-key * display-popup -w 60% -h 40% -x C -y C -E "$SHELL"

# Start session at 1 no 0
set -g base-index 1

# Mouse Mode (auto)
set -g mouse on

# Scroll History
set -g history-limit 30000

# Clipboard History
set -g buffer-limit 500

# Lower escape timing from 500ms to 50ms for quicker response to scroll-buffer access
set -s escape-time 50

# Synchronize panes
bind W set-window-option synchronize-panes

# Use prefix to split window horizontally and vertically
#bind h split-window -v
#bind v split-window -h

# Use prefix to split window horizontally and vertically in the current directory
bind-key v split-window -h -c "#{pane_current_path}"
bind-key h split-window -v -c "#{pane_current_path}"

# Switch panes using ctrl-arrow without prefix
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Shift + arrow to switch windows (tabs)
bind -n S-Left previous-window
bind -n S-Right next-window

# Move window (tab) in tmux
bind-key S-Left swap-window -t -1
bind-key S-Right swap-window -t +1

# Allow the arrow key to be used immediately after changing windows
set-option -g repeat-time 0

# Automatically reorder windows
set-option -g renumber-windows on

# Prevent show long-path in window-status format
set -g allow-rename off

# loud or quiet?
set-option -g visual-activity off
set-option -g visual-bell off
set-option -g visual-silence off
set-window-option -g monitor-activity off
set-option -g bell-action none

# Allow apps (ssh/nvim) to set the system clipboard via OSC 52 through tmux.
# Needed so linewise yanks (yy) stay linewise on p/P. Use "off" only on
# untrusted remotes where you don't want pane programs writing the clipboard.
set-option -s set-clipboard on

