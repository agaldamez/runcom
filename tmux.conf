# Easy config reload
bind-key r source-file ~/.tmux.conf \; display-message ".tmux.conf reloaded."

############################
####   Design Changes   ####
############################

# Tokyo Dark palette (tiagovla/tokyodark.nvim)
# bg0=#11121D  bg1=#1A1B2A  bg2=#212234  bg3=#353945
# fg=#A0A8CD   grey=#4A5057  blue=#7199EE  purple=#A485DD  cyan=#38A89D
# fg=#A0A8CD   grey=#4A5057  blue=#7199EE  pink=#FE6D85  purple=#A485DD  cyan=#38A89D -- live

# Enable truecolor (works well with tokyodark's terminal_colors)
set -g default-terminal "tmux-256color"
set -as terminal-overrides ",*:Tc"

# World clock timezones
set -g @world_clock_tz 'America/Los_Angeles'
set -g @world_clock_tz 'US/Eastern'
set -g @world_clock_tz 'UTC'

# World clock colors
set -g @world_clock_fgcolor '#A0A8CD'
set -g @world_clock_bgcolor '#212234'

# World clock format: military time
#set -g @world_clock_fmt '%tz:_%R'
#set -g @world_clock_fmt '#[bold]%tz#[nobold]:_%R'

# Prefix highlight (tmux-prefix-highlight plugin)
set -g @prefix_highlight_show_copy_mode 'on'
set -g @prefix_highlight_show_sync_mode 'on'
set -g @prefix_highlight_copy_prompt 'COPY'
set -g @prefix_highlight_sync_prompt 'SYNC'

# Prefix highlight colors
set -g @prefix_highlight_fg '#11121D'
set -g @prefix_highlight_bg '#FE6D85'
set -g @prefix_highlight_copy_mode_attr 'fg=#11121D,bg=#7199EE,bold'
set -g @prefix_highlight_sync_mode_attr 'fg=#11121D,bg=#95C561'
set -g @prefix_highlight_empty_attr 'fg=#A0A8CD,bg=#212234'

# Status bar (matches StatusLine / StatusLineNC)
set -g status-justify left
set -g status-interval 2
set -g status-style 'fg=#A0A8CD,bg=#212234'
set -g status-right ' #{prefix_highlight} #{?window_zoomed_flag,#[fg=#FE6D85#,bold] [Z] ,}#{world_clock_status}'
set -g status-right-style 'fg=#A0A8CD,bg=#212234'
set -g status-right-length 100

# Window tabs (matches TabLine / TabLineSel)
setw -g window-status-format ' #[fg=#4A5057,bg=#1A1B2A] #I #[fg=#A0A8CD,bg=#212234] #W '
#setw -g window-status-current-format ' #[fg=#11121D,bg=#7199EE,bold] #I #[fg=#7199EE,bg=#212234,bold] #W '
setw -g window-status-current-format ' #[fg=#11121D,bg=#FE6D85,bold] #I #[fg=#A0A8CD,bg=#212234,bold] #W '
setw -g window-status-style 'fg=#4A5057,bg=#1A1B2A'
setw -g window-status-current-style 'fg=#7199EE,bg=#212234'

# Pane borders (matches WinSeparator)
set -g pane-border-style 'fg=#353945'
set -g pane-active-border-style 'fg=#7199EE'

# Messages & modes
set -g message-style 'fg=#7199EE,bg=#11121D'
set -g message-command-style 'fg=#7199EE,bg=#11121D'
setw -g mode-style 'fg=#7199EE,bg=#212234,bold'

# Clock mode
setw -g clock-mode-colour '#7199EE'
setw -g clock-mode-style 12

##########################
####   Tmux Plugins   ####
##########################

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-logging'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'alexanderjeurissen/tmux-world-clock'
set -g @plugin 'laktak/extrakto'

# Extrakto configurations
set -g @extrakto_copy_key "tab"      # use tab to copy to clipboard
set -g @extrakto_insert_key "enter"  # use enter to insert selection

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
